appId: com.apkbolt.win
productName: ApkBolt
copyright: Copyright © 2026 ApkBolt

directories:
  output: dist/release
  buildResources: build

# Only include runtime-required files; source directory goes in unpackaged (no asar: window agent needs real .ps1 paths)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Runtime .xz image extraction (NAPI prebuilt, no ABI issues)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Keep only English locale (reduces Electron locales from 41MB to ~1.5MB)
electronLanguages:
  - en-US

# Full runtime (emulator + platform-tools + system image), generated by build/prepare-runtime.js.
# Bundled in installer — no downloads needed on first launch.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Install to current user directory — no admin rights required
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# appx target is not in the default build list — only used for Store packaging (npm run build:appx).
# Regular builds (npm run build:exe) only produce NSIS installer.
appx:
  identityName: AbhijeetKangane.ApkBolt
  publisher: "CN=58CA1DED-8AB3-4D0D-AF50-62C9B781AA4D"
  publisherDisplayName: Abhijeet Kangane
  displayName: ApkBolt
  applicationId: ApkBolt
  capabilities:
    - runFullTrust
  languages:
    - en-US
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # Standard wizard — lets users choose install location
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always: recreate desktop shortcut even if one already exists
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkBolt-${version}-Setup.exe
  # Kill running runtime processes before uninstall to prevent file-lock issues
  include: build/installer.nsh

# Compression: normal (zlib). System image is already xz/gz compressed; normal vs maximum
# saves very little on the Electron DLLs but avoids a 15-minute NSIS build on CI.
compression: normal

# ---------------- Linux / FydeOS ----------------
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: ApkBolt
      Comment: Run Android apps on FydeOS / Linux
      Categories: Utility;
